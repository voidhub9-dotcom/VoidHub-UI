<svg xmlns="http://www.w3.org/2000/svg" width="960" height="580" viewBox="0 0 960 580" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <radialGradient id="bg" cx="30%" cy="18%" r="95%">
      <stop offset="0%" stop-color="#17171D"/>
      <stop offset="70%" stop-color="#0A0A0C"/>
    </radialGradient>
    <radialGradient id="glowSilver" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#E6E6E6" stop-opacity="0.20"/>
      <stop offset="100%" stop-color="#E6E6E6" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#141419"/>
      <stop offset="100%" stop-color="#0E0E12"/>
    </linearGradient>
    <filter id="drop" x="-40%" y="-40%" width="180%" height="200%">
      <feDropShadow dx="0" dy="16" stdDeviation="22" flood-color="#000000" flood-opacity="0.55"/>
    </filter>
    <filter id="soft" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="9"/>
    </filter>
  </defs>

  <!-- backdrop -->
