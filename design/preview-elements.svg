<svg xmlns="http://www.w3.org/2000/svg" width="960" height="300" viewBox="0 0 960 300" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="scene" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#121218"/>
      <stop offset="100%" stop-color="#0A0A0E"/>
    </linearGradient>
  </defs>

  <rect width="960" height="300" fill="#08080A"/>

  <!-- card A: statuses -->
  <g>
    <rect x="16" y="20" width="292" height="252" rx="14" fill="url(#scene)" stroke="#232329"/>
    <text x="34" y="48" font-size="9.5" font-weight="800" letter-spacing="1.6" fill="#62626B">STATUS STYLES</text>
    <line x1="34" y1="60" x2="290" y2="60" stroke="#24242A"/>

    <text x="34" y="86" font-size="11.5" fill="#96DCAA" font-weight="600">Online</text>
    <text x="34" y="106" font-size="11.5" fill="#A7A7AA">players: <tspan fill="#F0B06C" font-weight="600">3 left</tspan></text>

    <rect x="240" y="74" width="50" height="20" rx="10" fill="#96DCAA" fill-opacity="0.10" stroke="#96DCAA" stroke-opacity="0.40"/>
    <circle cx="251" cy="84" r="3" fill="#96DCAA"/>
    <text x="258" y="87.5" font-size="9.5" fill="#96DCAA" font-weight="600">Ready</text>

    <text x="34" y="134" font-size="11" fill="#C9C9CE">Latency</text>
    <circle cx="268" cy="130" r="3" fill="#96DCAA"/>
    <text x="276" y="134" font-size="11" fill="#F0F0F0" font-weight="600">48 ms</text>

    <text x="34" y="162" font-size="11" fill="#C9C9CE" left-margin="0">Workspace</text>
    <rect x="34" y="172" width="256" height="4" rx="2" fill="#24242A"/>
    <rect x="34" y="172" width="184" height="4" rx="2" fill="#E6E6E6"/>
    <text x="276" y="162" font-size="10" fill="#A7A7AA" text-anchor="end">72%</text>

    <text x="34" y="204" font-size="11" fill="#C9C9CE">Hold your breath</text>
    <rect x="34" y="214" width="256" height="6" rx="3" fill="#24242A"/>
    <rect x="34" y="214" width="96" height="6" rx="3" fill="#F0B06C"/>
    <text x="276" y="204" font-size="10" fill="#F0B06C" text-anchor="end">O₂ · 37%</text>

    <rect x="34" y="236" width="126" height="22" rx="11" fill="#E6E6E6" fill-opacity="0.08" stroke="#E6E6E6" stroke-opacity="0.30"/>
    <text x="42" y="250" font-size="10" fill="#E6E6E6" font-weight="600">PINNED STATUS</text>
    <text x="170" y="250" font-size="9.5" fill="#62626B">pins right on the pill</text>
  </g>

  <!-- card B: log feed -->
  <g>
    <rect x="334" y="20" width="292" height="252" rx="14" fill="url(#scene)" stroke="#232329"/>
    <text x="352" y="48" font-size="9.5" font-weight="800" letter-spacing="1.6" fill="#62626B">LOG FEED</text>
    <line x1="352" y1="60" x2="610" y2="60" stroke="#24242A"/>

    <rect x="352" y="72" width="256" height="148" rx="8" fill="#0B0B0E" stroke="#222228"/>
    <text x="364" y="94" font-size="10.5" fill="#62626B">21:02</text><text x="400" y="94" font-size="10.5" fill="#C9C9CE">workspace mounted</text>
    <text x="364" y="116" font-size="10.5" fill="#62626B">21:02</text><text x="400" y="116" font-size="10.5"><tspan fill="#96DCAA">Enabled</tspan><tspan fill="#C9C9CE"> set to </tspan><tspan fill="#96DCAA">true</tspan></text>
    <text x="364" y="138" font-size="10.5" fill="#62626B">21:04</text><text x="400" y="138" font-size="10.5"><tspan fill="#F0B06C">warning</tspan><tspan fill="#C9C9CE"> · config not found</tspan></text>
    <text x="364" y="160" font-size="10.5" fill="#62626B">21:05</text><text x="400" y="160" font-size="10.5"><tspan fill="#F07878">error</tspan><tspan fill="#C9C9CE"> · teleport blocked</tspan></text>
    <text x="364" y="182" font-size="10.5" fill="#62626B">21:07</text><text x="400" y="182" font-size="10.5" fill="#C9C9CE">intensity locked at 65%</text>
    <circle cx="367" cy="198" r="1.5" fill="#38383F"/><circle cx="374" cy="198" r="1.5" fill="#38383F"/><circle cx="381" cy="198" r="1.5" fill="#38383F"/>

    <rect x="352" y="230" width="256" height="28" rx="7" fill="#0C0C0F" stroke="#2A2A31"/>
    <text x="364" y="248" font-size="10.5" fill="#62626B">push your own events…</text>
  </g>

  <!-- card C: table -->
  <g>
    <rect x="652" y="20" width="292" height="252" rx="14" fill="url(#scene)" stroke="#232329"/>
    <text x="670" y="48" font-size="9.5" font-weight="800" letter-spacing="1.6" fill="#62626B">TABLE</text>

    <rect x="670" y="62" width="256" height="24" rx="7" fill="#0C0C0F" stroke="#2A2A31"/>
    <circle cx="686" cy="74" r="3.6" fill="none" stroke="#A7A7AA" stroke-width="1.3"/>
    <line x1="689" y1="77" x2="692" y2="80" stroke="#A7A7AA" stroke-width="1.3" stroke-linecap="round"/>
    <text x="700" y="78" font-size="10.5" fill="#62626B">search rows…</text>

    <text x="686" y="106" font-size="9" font-weight="800" letter-spacing="0.8" fill="#62626B">NAME</text>
    <text x="786" y="106" font-size="9" font-weight="800" letter-spacing="0.8" fill="#62626B">LEVEL</text>
    <text x="864" y="106" font-size="9" font-weight="800" letter-spacing="0.8" fill="#62626B">ONLINE</text>

    <rect x="670" y="112" width="256" height="30" rx="6" fill="#141419"/>
    <text x="686" y="131" font-size="11" fill="#F2F2F2">von63rd</text>
    <text x="786" y="131" font-size="11" fill="#C9C9CE">2499</text>
    <circle cx="869" cy="127" r="3.2" fill="#96DCAA"/>

    <rect x="670" y="146" width="256" height="30" rx="6" fill="#101015"/>
    <text x="686" y="165" font-size="11" fill="#F2F2F2">Delta_7</text>
    <text x="786" y="165" font-size="11" fill="#C9C9CE">1840</text>
    <circle cx="869" cy="161" r="3.2" fill="#62626B"/>

    <rect x="670" y="180" width="256" height="30" rx="6" fill="none" stroke="#E6E6E6" stroke-opacity="0.35"/>
    <rect x="670" y="180" width="3" height="30" rx="1.5" fill="#E6E6E6"/>
    <text x="686" y="199" font-size="11" font-weight="600" fill="#F5F5F5">Hydra</text>
    <text x="786" y="199" font-size="11" font-weight="600" fill="#F5F5F5">2011</text>
    <circle cx="869" cy="195" r="3.2" fill="#96DCAA"/>
    <text x="876" y="199" font-size="9.5" fill="#96DCAA" font-weight="600">highlight</text>

    <rect x="670" y="214" width="256" height="30" rx="6" fill="#101015"/>
    <text x="686" y="233" font-size="11" fill="#F2F2F2">Nova</text>
    <text x="786" y="233" font-size="11" fill="#C9C9CE">1620</text>
    <circle cx="869" cy="229" r="3.2" fill="#96DCAA"/>

    <text x="670" y="262" font-size="9.5" fill="#62626B">sortable · searchable · editable columns · flags</text>
  </g>

  <text x="944" y="290" font-size="9" fill="#4A4A52" text-anchor="end">design mockup · default VoidHub theme</text>
</svg>
