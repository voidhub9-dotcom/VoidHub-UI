<svg xmlns="http://www.w3.org/2000/svg" width="960" height="440" viewBox="0 0 960 440" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="scene" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3A4756"/>
      <stop offset="65%" stop-color="#2A3138"/>
      <stop offset="100%" stop-color="#232A22"/>
    </linearGradient>
    <radialGradient id="vign" cx="50%" cy="38%" r="75%">
      <stop offset="0%" stop-color="#000000" stop-opacity="0"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.35"/>
    </radialGradient>
    <!-- One soft shadow plus a 1px contact shadow: no glow halo. -->
    <filter id="lift" x="-30%" y="-40%" width="160%" height="200%">
      <feDropShadow dx="0" dy="8" stdDeviation="11" flood-color="#000000" flood-opacity="0.45"/>
      <feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <rect width="960" height="440" fill="#08080A"/>

  <!-- ============ card 1: compact ============ -->
  <g>
    <rect x="16" y="16" width="292" height="400" rx="16" fill="url(#scene)" stroke="#232329"/>
    <path d="M16,336 C70,318 130,334 180,322 C230,310 266,326 308,314 L308,416 L16,416 Z" fill="#1C221B" opacity="0.8"/>
    <rect x="16" y="16" width="292" height="400" rx="16" fill="url(#vign)"/>

    <!-- running + pinned status -->
    <rect x="44" y="66" width="236" height="44" rx="22" fill="#0B0B0B" stroke="#FFFFFF" stroke-opacity="0.07" filter="url(#lift)"/>
    <circle cx="72" cy="88" r="16" fill="#262626"/>
    <path d="M66.5,82 L72,94 L77.5,82" fill="none" stroke="#E6E6E6" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="83.3" cy="76.7" r="4" fill="#96DCAA" stroke="#0B0B0B" stroke-width="2"/>
    <text x="96" y="85" font-size="12.5" font-weight="650" fill="#F5F5F5">VoidHub</text>
    <text x="96" y="99" font-size="9.5" fill="#A7A7A7">Speed <tspan fill="#96DCAA" font-weight="600">32 studs/s</tspan></text>
    <g fill="#E6E6E6">
      <rect x="219" y="82" width="3" height="12" rx="1.5"/>
      <rect x="224" y="85" width="3" height="6" rx="1.5"/>
      <rect x="229" y="81" width="3" height="14" rx="1.5"/>
      <rect x="234" y="84" width="3" height="8" rx="1.5"/>
    </g>
    <circle cx="261" cy="88" r="11" fill="#262626"/>
    <text x="261" y="91.8" font-size="10.5" font-weight="700" fill="#F5F5F5" text-anchor="middle">3</text>

    <!-- idle -->
    <rect x="44" y="150" width="236" height="44" rx="22" fill="#0B0B0B" stroke="#FFFFFF" stroke-opacity="0.07" filter="url(#lift)"/>
    <circle cx="72" cy="172" r="16" fill="#262626"/>
    <path d="M66.5,166 L72,178 L77.5,166" fill="none" stroke="#E6E6E6" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="96" y="169" font-size="12.5" font-weight="650" fill="#F5F5F5">VoidHub</text>
    <text x="96" y="183" font-size="9.5" fill="#A7A7A7">Minimized</text>
    <circle cx="232" cy="172" r="3" fill="#96DCAA"/>
    <text x="268" y="176" font-size="11" font-weight="650" fill="#A7A7A7" text-anchor="end">12:47</text>

    <text x="162" y="374" font-size="9" font-weight="700" letter-spacing="1.4" fill="#8A8F96" text-anchor="middle">01 · COMPACT, RUNNING AND IDLE</text>
  </g>

  <!-- ============ card 2: live session ============ -->
  <g>
    <rect x="334" y="16" width="292" height="400" rx="16" fill="url(#scene)" stroke="#232329"/>
    <rect x="334" y="16" width="292" height="400" rx="16" fill="url(#vign)"/>

    <rect x="350" y="28" width="260" height="226" rx="28" fill="#0B0B0B" stroke="#FFFFFF" stroke-opacity="0.07" filter="url(#lift)"/>

    <text x="366" y="52" font-size="9" font-weight="700" letter-spacing="1.6" fill="#A7A7A7">LIVE SESSION</text>
    <g fill="#E6E6E6">
      <rect x="577" y="44" width="2" height="7" rx="1"/>
      <rect x="582" y="46" width="2" height="3" rx="1"/>
      <rect x="587" y="43" width="2" height="9" rx="1"/>
      <rect x="592" y="45" width="2" height="5" rx="1"/>
    </g>

    <circle cx="387" cy="82" r="20" fill="#262626"/>
    <circle cx="387" cy="82" r="22.5" fill="none" stroke="#96DCAA" stroke-opacity="0.9" stroke-width="1.5"/>
    <circle cx="387" cy="77" r="5.5" fill="#C9C9CE"/>
    <path d="M377,94 c2,-7 5.5,-10 10,-10 s8,3 10,10" fill="#C9C9CE" opacity="0.85"/>
    <text x="419" y="79" font-size="13" font-weight="700" fill="#F5F5F5">von63rd</text>
    <text x="419" y="94" font-size="10" fill="#A7A7A7">Blox Fruits</text>
    <text x="594" y="80" font-size="17" font-weight="700" fill="#F5F5F5" text-anchor="end">12:47</text>
    <text x="594" y="94" font-size="9" fill="#A7A7A7" text-anchor="end">session</text>

    <rect x="366" y="114" width="112" height="56" rx="12" fill="#191919" stroke="#FFFFFF" stroke-opacity="0.04"/>
    <text x="378" y="134" font-size="15" font-weight="700" fill="#F5F5F5">58<tspan font-size="9" fill="#A7A7A7"> fps</tspan></text>
    <text x="378" y="148" font-size="7.5" font-weight="700" letter-spacing="1" fill="#A7A7A7">FRAME RATE</text>
    <rect x="378" y="158" width="88" height="3" rx="1.5" fill="#262626"/>
    <rect x="378" y="158" width="82" height="3" rx="1.5" fill="#96DCAA"/>

    <rect x="486" y="114" width="112" height="56" rx="12" fill="#191919" stroke="#FFFFFF" stroke-opacity="0.04"/>
    <text x="498" y="134" font-size="15" font-weight="700" fill="#F5F5F5">42<tspan font-size="9" fill="#A7A7A7"> ms</tspan></text>
    <text x="498" y="148" font-size="7.5" font-weight="700" letter-spacing="1" fill="#A7A7A7">LATENCY</text>
    <rect x="498" y="158" width="88" height="3" rx="1.5" fill="#262626"/>
    <rect x="498" y="158" width="88" height="3" rx="1.5" fill="#96DCAA"/>

    <text x="366" y="188" font-size="7.5" font-weight="700" letter-spacing="0.8" fill="#A7A7A7">PLAYERS</text>
    <text x="366" y="202" font-size="11.5" font-weight="700" fill="#F5F5F5">7/12</text>
    <text x="448" y="188" font-size="7.5" font-weight="700" letter-spacing="0.8" fill="#A7A7A7">ACTIVE</text>
    <text x="448" y="202" font-size="11.5" font-weight="700" fill="#E6E6E6">3</text>
    <text x="508" y="188" font-size="7.5" font-weight="700" letter-spacing="0.8" fill="#A7A7A7">CURRENT TAB</text>
    <text x="508" y="202" font-size="11.5" font-weight="700" fill="#F5F5F5">Main</text>

    <rect x="366" y="212" width="228" height="30" rx="15" fill="#191919" stroke="#FFFFFF" stroke-opacity="0.08"/>
    <text x="380" y="231" font-size="11" font-weight="700" fill="#F5F5F5">Restore window</text>
    <rect x="530" y="217" width="56" height="20" rx="6" fill="#262626"/>
    <text x="558" y="230.5" font-size="8.5" font-weight="700" fill="#A7A7A7" text-anchor="middle">RightCtrl</text>

    <text x="480" y="374" font-size="9" font-weight="700" letter-spacing="1.4" fill="#8A8F96" text-anchor="middle">02 · LIVE SESSION (HOVER)</text>
  </g>

  <!-- ============ card 3: notifications ============ -->
  <g>
    <rect x="652" y="16" width="292" height="400" rx="16" fill="url(#scene)" stroke="#232329"/>
    <path d="M652,336 C706,318 766,334 816,322 C866,310 902,326 944,314 L944,416 L652,416 Z" fill="#1C221B" opacity="0.8"/>
    <rect x="652" y="16" width="292" height="400" rx="16" fill="url(#vign)"/>

    <!-- success -->
    <rect x="668" y="40" width="260" height="70" rx="30" fill="#0B0B0B" stroke="#FFFFFF" stroke-opacity="0.07" filter="url(#lift)"/>
    <circle cx="702" cy="70" r="18" fill="#96DCAA" fill-opacity="0.16"/>
    <path d="M695.5,70.5 l4.5,4.5 8,-8.5" fill="none" stroke="#96DCAA" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="732" y="66" font-size="12" font-weight="700" fill="#F5F5F5">Auto Farm</text>
    <text x="732" y="81" font-size="10" fill="#A7A7A7">Loop complete · 124 items</text>
    <rect x="732" y="92" width="150" height="2" rx="1" fill="#262626"/>
    <rect x="732" y="92" width="96" height="2" rx="1" fill="#96DCAA"/>
    <g fill="#96DCAA">
      <rect x="895" y="58" width="2" height="7" rx="1"/>
      <rect x="900" y="60" width="2" height="3" rx="1"/>
      <rect x="905" y="57" width="2" height="9" rx="1"/>
      <rect x="910" y="59" width="2" height="5" rx="1"/>
    </g>

    <!-- warning -->
    <rect x="668" y="126" width="260" height="70" rx="30" fill="#0B0B0B" stroke="#FFFFFF" stroke-opacity="0.07" filter="url(#lift)"/>
    <circle cx="702" cy="156" r="18" fill="#F0B06C" fill-opacity="0.16"/>
    <path d="M702,148 L702,158" stroke="#F0B06C" stroke-width="2.2" stroke-linecap="round"/>
    <circle cx="702" cy="163.5" r="1.4" fill="#F0B06C"/>
    <text x="732" y="152" font-size="12" font-weight="700" fill="#F5F5F5">High ping</text>
    <text x="732" y="167" font-size="10" fill="#A7A7A7">Latency above 250 ms for 10 s</text>
    <rect x="732" y="178" width="150" height="2" rx="1" fill="#262626"/>
    <rect x="732" y="178" width="58" height="2" rx="1" fill="#F0B06C"/>
    <g fill="#F0B06C">
      <rect x="895" y="144" width="2" height="5" rx="1"/>
      <rect x="900" y="142" width="2" height="9" rx="1"/>
      <rect x="905" y="145" width="2" height="3" rx="1"/>
      <rect x="910" y="143" width="2" height="7" rx="1"/>
    </g>

    <!-- error -->
    <rect x="668" y="212" width="260" height="70" rx="30" fill="#0B0B0B" stroke="#FFFFFF" stroke-opacity="0.07" filter="url(#lift)"/>
    <circle cx="702" cy="242" r="18" fill="#F07878" fill-opacity="0.16"/>
    <path d="M697,237 L707,247 M707,237 L697,247" stroke="#F07878" stroke-width="2" stroke-linecap="round"/>
    <text x="732" y="238" font-size="12" font-weight="700" fill="#F5F5F5">Teleport failed</text>
    <text x="732" y="253" font-size="10" fill="#A7A7A7">Target is out of range</text>
    <rect x="732" y="264" width="150" height="2" rx="1" fill="#262626"/>
    <rect x="732" y="264" width="120" height="2" rx="1" fill="#F07878"/>
    <g fill="#F07878">
      <rect x="895" y="231" width="2" height="8" rx="1"/>
      <rect x="900" y="233" width="2" height="4" rx="1"/>
      <rect x="905" y="230" width="2" height="9" rx="1"/>
      <rect x="910" y="232" width="2" height="6" rx="1"/>
    </g>

    <text x="798" y="374" font-size="9" font-weight="700" letter-spacing="1.4" fill="#8A8F96" text-anchor="middle">03 · NOTIFICATIONS, TIMER LINE</text>
  </g>

  <text x="944" y="430" font-size="9" fill="#4A4A52" text-anchor="end">design mockup · default VoidHub theme</text>
</svg>
